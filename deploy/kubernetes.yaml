apiVersion: v1
kind: Namespace
metadata:
  name: ai-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: real-time-ai-pipeline
  namespace: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels: {app: real-time-ai-pipeline}
  template:
    metadata: {labels: {app: real-time-ai-pipeline}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: real-time-ai-pipeline:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}}
